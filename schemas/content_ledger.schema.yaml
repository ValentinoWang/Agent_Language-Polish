# HUMAN-READABLE CONTRACT, NOT THE MACHINE SOURCE OF TRUTH.
# Machine source: src/styleos/models.py::ContentLedger
# Hard locks: exact regression for successfully extracted numbers, dates, citations, equations, quotes and identifiers.
# Semantic locks: claims, conditions, causal links and statement grades; uncertainty blocks automatic pass.
ledger_id: ledger_example
source_hash: sha256
hard_locks:
  entities: []
  numbers: []
  units: []
  dates: []
  citations: []
  equations: []
  quotes: []
  identifiers: []
semantic_locks:
  - kind: claim
    text: 在当前参数范围内，结果表明……
    strength: 2
    scope: 当前参数范围
    confidence: 1.0
allowed_operations: [replace_wording, remove_redundancy]
forbidden_operations: [add_facts, delete_conditions, upgrade_claim_strength, alter_hard_locks]
gaps: []
extraction:
  hard_lock_regression_scope: only items successfully extracted into the ledger
  semantic_policy: uncertain means review_required, never automatic pass
