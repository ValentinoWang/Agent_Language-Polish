name: ci
# 本项目以本地 CI 为唯一常规门禁: bash scripts/ci.sh (合并前必跑, 详见 docs/04 §5)。
# 此工作流不在 push/PR 上触发(不消耗 Actions 分钟数), 仅保留手动入口用于偶发的
# 云端交叉验证, 且复用同一脚本, 保证两边检查一致。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: CI_DOCKER=1 bash scripts/ci.sh
