[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "styleos"
version = "0.3.0rc1"
description = "Auditable non-parametric style compiler for content-preserving rewriting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "StyleOS Contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
langfuse = ["langfuse>=2.0"]
optimize = ["dspy-ai>=2.5"]
documents = ["markitdown>=0.1", "docling>=2.0"]
qdrant = ["qdrant-client>=1.11"]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
styleos = "styleos.cli:app"
styleos-mcp = "styleos.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/styleos"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "styleos/packs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["styleos"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
