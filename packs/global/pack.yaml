pack: global.deai
name: 去 AI 味改写（通用）
kind: utility
version: 0.2.0
language: zh-CN
owner: valentino
description: 冻结内容账本后执行条件式文风清理；硬锁精确回归，语义锁不确定时阻断自动通过。
inputs:
  - {slot: 文体, type: text, required: true, source: user, description: 目标文体}
  - {slot: 受众, type: text, required: true, source: user, description: 读者知识假设}
  - {slot: 渠道, type: text, required: true, source: user, description: 发布渠道}
  - slot: 改写强度
    type: enum
    required: true
    source: user
    enum: [conservative, balanced, strong]
    description: 操作授权
  - {slot: 待改文本, type: text, required: true, source: user, description: 原稿}
outputs:
  - {name: content_ledger, format: json, description: 硬锁与语义锁}
  - {name: final, format: markdown, description: 改写稿}
  - {name: diff, format: markdown, description: 统一差异}
  - {name: audit, format: json, description: 硬锁、语义锁、规则审计}
targets:
  prompt: {file: prompt.deai_rewrite.zh.md, since: v0}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_rewrite, since: v0.2}
compiled_from:
  blocks: [task_contract, content_ledger, operation_rules, output_contract]
  style_cards: []
  domain_pack: null
  negative_cards: [packs/global/deai.negative.zh.yaml]
delivery: {prompt: ready, skill: buildable, cli: ready, mcp: ready, api: ready}
validation:
  example: passed
  automated_smoke: passed
  formal_blind_test: pending
  real_pilot: pending
  notes: [自动化测试只证明工程合同；正式盲测与授权 Pilot 需要真实运行。]
maturity: engine_compiled
eval:
  evaluator_profile: global.deai
  baseline: one_shot_deai
  smoke_set: evaluations/smoke/global.deai
  formal_set: null
  gates: {hard_lock_regression: 1.0, new_hard_facts: 0, semantic_uncertainty_requires_review: true}
changelog:
  - {version: 0.2.0, date: 2026-08-28, change: 状态三轴、硬锁/语义锁审计、分级规则检测与可编译交付}
