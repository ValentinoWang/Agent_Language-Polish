version: 0.2.1
id: global.deai.negative.zh
principles:
  - 每句话必须产生信息增量；删除后信息不变的句子应删除。
  - 事实、数字、引用、公式、主张强度和适用边界不得因文风调整而漂移。
  - 条件式规则不是禁词表；命中只代表需要按语境判断。
  - 无法自动判断的语义规则必须进入人工或语义审计，不得伪装成正则命中。
rules:
  - id: empty_opening
    name: 空泛开场
    detect: 以无信息量的时代背景或技术发展铺垫开头
    policy: remove_when_no_function
    allow_when: [背景本身是后文论证所需事实]
    reject_when: [删除后正文信息完全不变]
    fix_hint: 直接从事实、冲突、结果或场景进入
    detector:
      level: deterministic
      type: regex
      blocking: false
      patterns:
        - 在当今快速发展的时代
        - 随着人工智能技术的不断进步
        - 近年来[，,]?越来越多的人
  - id: empty_transition
    name: 空转过渡
    detect: 过渡词不承担真实逻辑功能
    policy: remove_when_no_function
    allow_when: [删除后上下句逻辑关系会变得不清楚]
    fix_hint: 用具体因果或转折内容连接
    detector:
      level: deterministic
      type: literal
      blocking: false
      patterns: [值得注意的是, 众所周知, 总的来说, 综上所述, 总而言之, 不仅如此, 不难发现]
  - id: mechanical_enumeration
    name: 机械枚举
    detect: 首先、其次等顺序词被用作模板，而不是表达真实步骤关系
    policy: conditional
    allow_when: [确实是有强顺序的操作步骤]
    fix_hint: 按真实层级组织并允许不对称
    detector:
      level: deterministic
      type: regex
      blocking: false
      patterns:
        - 首先.{0,120}其次
        - 首先.{0,120}其次.{0,120}(?:再次|最后)
  - id: ai_pet_phrases
    name: AI 高频邀约口癖
    detect: 让我们或让我们一起被机械用作无信息量的引导
    policy: cap
    allow_when: [确实需要邀请读者共同执行一个明确动作]
    fix_hint: 直接说明动作、对象和结果
    detector:
      level: deterministic
      type: regex
      blocking: false
      patterns: ['让我们(?:一起)?']
      max_count: 0
  - id: uniform_sentence_shape
    name: 句形匀质
    detect: 连续句子的长度和结构近乎完全一致
    policy: conditional
    allow_when: [法律条款或结构化清单需要平行]
    fix_hint: 按信息轻重形成自然长短变化
    detector: {level: statistical, type: counter, blocking: false, patterns: []}
  - id: per_paragraph_summary
    name: 段段总结
    detect: 每段结尾都重复总结一次
    policy: cap
    allow_when: [长篇教学材料需要阶段收束]
    fix_hint: 只在真正的收束点总结
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: over_symmetry
    name: 过度对称
    detect: 为整齐而强造三段排比或口号
    policy: conditional
    allow_when: [演讲口号且三项内容确实对称]
    fix_hint: 改成有信息量的判断句
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: false_contrast
    name: 假对立
    detect: 不是A而是B中的A并非真实竞争解释
    policy: conditional
    allow_when: [A已在正文中真实出现, B有证据支撑]
    fix_hint: 直接陈述B或引入真实对比对象
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: not_only_but_also
    name: 递进堆叠
    detect: 不仅更是被用来拔高而非增加信息
    policy: cap
    allow_when: [两个层次均有独立实质内容]
    fix_hint: 保留信息量更高的表达
    detector: {level: deterministic, type: regex, blocking: false, patterns: ['不仅.{0,80}(?:更|还)'], max_count: 1}
  - id: strawman_setup
    name: 虚构假想敌
    detect: 很多人以为但没有证据说明该误解真实存在
    policy: conditional
    allow_when: [该误解有真实来源或用户数据]
    fix_hint: 直接给观点和证据
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: synonym_restatement
    name: 同义反复
    detect: 近义词连续重述同一意思且无信息增量
    policy: remove_when_no_function
    allow_when: [修辞性重复确有节奏功能]
    fix_hint: 留下最准确的词或补具体后果
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: abstract_noun_inflation
    name: 抽象名词堆砌
    detect: 抽象词叠加后无法回答谁做了什么
    policy: conditional
    allow_when: [术语在领域内有明确可验证定义]
    fix_hint: 改成主体、动作和结果
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: abstract_cliche_density
    name: 抽象套话密度
    detect: 赋能、打造闭环、深度融合或引发繿泛关注等套话替代了具体主体与动作
    policy: cap
    allow_when: [术语有明确定义且同句给出了具体主体、动作和结果]
    fix_hint: 命中后逐项改写为谁做了什么以及产生了什么结果
    detector:
      level: statistical
      type: literal
      blocking: false
      patterns: [赋能, 打造闭环, 深度融合, 引发了广泛关注]
      max_count: 0
  - id: unfounded_significance
    name: 无依据意义拔高
    detect: 具有重要意义或全新视角没有具体对象和后果
    policy: conditional
    allow_when: [意义已被具体证据说明]
    fix_hint: 写清对谁改变了什么，否则删除
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: evidence_inflation
    name: 证据强度夸大
    detect: 弱证据被写成证明、普遍适用或彻底解决
    policy: conditional
    allow_when: [内容账本明确允许该强度]
    fix_hint: 改成表明、提示、支持某解释，并保留范围
    detector: {level: semantic, type: llm_judge, blocking: true, patterns: []}
  - id: hedging_boilerplate
    name: 万能免责
    detect: 因人而异或仅供参考没有写出真实边界
    policy: conditional
    allow_when: [明确给出适用边界]
    fix_hint: 写具体边界或删除
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: hype_words
    name: 高唤醒词堆叠
    detect: 炸裂、颠覆、天花板等词密集出现
    policy: cap
    allow_when: [人设卡明确允许且单篇低频]
    fix_hint: 让事实落差制造情绪
    detector: {level: deterministic, type: literal, blocking: false, patterns: [炸裂, 颠覆, 王炸, 天花板, 杀疯了], max_count: 2}
  - id: slogan_over_logic
    name: 口号替代论证
    detect: 商业口号占据了本应提供数据、假设或推算的位置
    policy: conditional
    allow_when: [仅作为标题且正文已完成论证]
    fix_hint: 标记事实、假设、推算和愿景的级别
    detector: {level: semantic, type: llm_judge, blocking: true, patterns: []}
  - id: known_concept_lecture
    name: 重复解释已知概念
    detect: 对专家解释其领域常识或对老受众重复入门定义
    policy: conditional
    allow_when: [受众明确为零基础]
    fix_hint: 按读者知识假设压缩解释
    detector: {level: human, type: manual, blocking: false, patterns: []}
  - id: textbook_definition
    name: 教科书定义腔
    detect: 专业文本频繁使用X是指一种方法的入门式定义
    policy: conditional
    allow_when: [术语为本文新定义或受众零基础]
    fix_hint: 在句内完成必要限定
    detector: {level: semantic, type: llm_judge, blocking: false, patterns: []}
  - id: exclamation_overuse
    name: 感叹号过量
    detect: 感叹号数量超过渠道自然基线
    policy: cap
    allow_when: [人设与渠道明确需要高情绪]
    fix_hint: 用事实和节奏代替连续感叹号
    detector: {level: statistical, type: counter, blocking: false, patterns: [], max_count: 2}
  - id: invented_personal_story
    name: 凭空个人经历
    detect: 内容账本无第一人称经历却新增我有个学生或粉丝案例
    policy: forbid
    allow_when: []
    reject_when: [账本没有对应经历]
    fix_hint: 删除或要求用户补充真实材料
    detector: {level: semantic, type: llm_judge, blocking: true, patterns: []}
