pack: self_media
name: 自媒体口播脚本
kind: writing_module
version: 0.2.0
language: zh-CN
owner: valentino
description: 将选题、事实账本与人设卡编译为可朗读口播稿，输出钩子、停顿、留点、字幕和发布配套。
inputs:
  - slot: 平台
    type: enum
    required: true
    source: user
    enum: [抖音, 视频号, B站, 小红书, 播客]
    description: 渠道
  - {slot: 目标时长, type: number, required: true, source: user, description: 秒}
  - {slot: 选题, type: text, required: true, source: user, description: 主题}
  - {slot: 人设, type: yaml, required: true, source: style_card, description: StyleCard 或三行临时卡}
  - {slot: 内容账本, type: markdown, required: true, source: ledger, description: 事实、经历与禁区}
outputs:
  - {name: hooks, format: markdown, description: 主钩子与备选}
  - {name: script, format: markdown, description: 带停顿和留点的口播稿}
  - {name: subtitles, format: markdown, description: 字幕版}
  - {name: publish_kit, format: markdown, description: 标题与置顶评论}
  - {name: audit, format: json, description: 时长、事实、钩子和人设审计}
targets:
  prompt: {file: prompt.script_writing.zh.md, since: v0}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_rewrite, since: v0.2}
compiled_from:
  blocks: [task_contract, content_ledger, style_card, domain_pack, exemplars, operation_rules, output_contract]
  style_cards: []
  domain_pack: packs/self_media
  negative_cards: [packs/global/deai.negative.zh.yaml]
delivery: {prompt: ready, skill: buildable, cli: ready, mcp: ready, api: ready}
validation:
  example: passed
  automated_smoke: passed
  formal_blind_test: pending
  real_pilot: pending
  notes: [句长和时长属于口播赛道规则，不外推到论文或 BP。]
maturity: engine_compiled
eval:
  evaluator_profile: self_media
  baseline: one_shot_script
  smoke_set: evaluations/smoke/self_media
  formal_set: null
  gates: {new_hard_facts: 0, hook_fulfilled: true, invented_personal_story: 0, duration_error_ratio: '<=0.15'}
changelog:
  - {version: 0.2.0, date: 2026-08-28, change: 可运行口播合同、专属评测和多目标交付}
