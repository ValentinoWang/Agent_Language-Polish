pack: imitate
name: 指定风格创作与改写
kind: writing_module
version: 0.2.0
language: zh-CN
owner: valentino
description: StyleCard 只提供表达形式，ContentLedger 只提供事实；两者隔离后生成提纲、成稿与审计。
inputs:
  - slot: 任务类型
    type: enum
    required: true
    source: user
    enum: [create, rewrite]
    description: 新写或改写
  - {slot: 体裁/渠道/受众/篇幅, type: text, required: true, source: user, description: 任务合同}
  - {slot: 风格卡, type: yaml, required: true, source: style_card, description: 正式任务必须 human_approved}
  - {slot: 内容账本, type: markdown, required: true, source: ledger, description: 唯一事实来源}
outputs:
  - {name: outline, format: markdown, description: 段落功能提纲}
  - {name: final, format: markdown, description: 成稿}
  - {name: audit, format: json, description: 风格与事实审计}
targets:
  prompt: {file: prompt.style_imitate.zh.md, since: v0}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_rewrite, since: v0.2}
compiled_from:
  blocks: [task_contract, content_ledger, style_card, domain_pack, exemplars, operation_rules, output_contract]
  style_cards: []
  domain_pack: null
  negative_cards: [packs/global/deai.negative.zh.yaml]
delivery: {prompt: ready, skill: buildable, cli: ready, mcp: ready, api: ready}
validation:
  example: passed
  automated_smoke: passed
  formal_blind_test: pending
  real_pilot: pending
  notes: [合成测试不等于真人风格相似度验证。]
maturity: engine_compiled
eval:
  evaluator_profile: imitate
  baseline: paste_examples_only
  smoke_set: evaluations/smoke/imitate
  formal_set: null
  gates: {style_card_approved: true, hard_lock_regression: 1.0, new_hard_facts: 0}
changelog:
  - {version: 0.2.0, date: 2026-08-28, change: 双源隔离、运行时审计、CLI/API/MCP 交付}
