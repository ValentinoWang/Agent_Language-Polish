pack: distill
name: 风格蒸馏（语料到 StyleCard）
kind: writing_module
version: 0.2.0
language: zh-CN
owner: valentino
description: 从同一作者、渠道与人设的授权语料提取可测风格特征，生成带证据的 draft StyleCard，并强制人工批准。
inputs:
  - {slot: 作者/人设名, type: text, required: true, source: user, description: 卡片身份}
  - {slot: 赛道, type: text, required: true, source: user, description: self_media/academic/business}
  - {slot: 渠道, type: text, required: true, source: user, description: 一次只处理一个渠道}
  - {slot: 目标受众, type: text, required: true, source: user, description: 受众}
  - {slot: 语料, type: text, required: true, source: corpus, description: 至少两篇；正式人工蒸馏建议三到十篇}
outputs:
  - {name: style_card, format: yaml, description: draft 卡}
  - {name: evidence_rules, format: table, description: 规则、证据与置信度}
  - {name: review_queue, format: markdown, description: 待人工确认项}
targets:
  prompt: {file: prompt.style_distill.zh.md, since: v0}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_distill, since: v0.2}
compiled_from:
  blocks: [task_contract, exemplars, output_contract]
  style_cards: []
  domain_pack: null
  negative_cards: [packs/global/deai.negative.zh.yaml]
delivery: {prompt: ready, skill: buildable, cli: ready, mcp: ready, api: ready}
validation:
  example: passed
  automated_smoke: passed
  formal_blind_test: pending
  real_pilot: pending
  notes: [确定性特征只建立表层证据；正式风格规则仍需人工复核。]
maturity: engine_compiled
eval:
  evaluator_profile: distill
  baseline: free_form_summary
  smoke_set: evaluations/smoke/distill
  formal_set: null
  gates: {evidence_coverage: 1.0, raw_corpus_embedded: false, human_approval_required: true, repeatability_reported: true}
changelog:
  - {version: 0.2.0, date: 2026-08-28, change: 确定性特征基线、证据规则、人工批准与专属评测}
