# 遵循 schemas/pack_manifest.schema.yaml
pack: business
name: 商业计划书与融资材料
kind: writing_module
version: 0.0.1
status: planned          # 未交付 prompt target, 不可即插即用
language: zh-CN
owner: valentino
description: >
  BP 正文 / 路演稿 / 演讲口播三种文风分治; 陈述强制定级(verified_fact/internal_data/
  external_estimate/management_assumption/forecast/aspiration), 定级只降不升,
  防止"计划达到"被润色成"已经实现"。市场规模的事实/假设/推算三分离。
  特化负面规则: 口号替代论证、护城河空转表述、形式化风险列举。

# 计划中的输入: 投资阶段 / 材料类型(BP章节|路演稿|口播) / 陈述定级清单 / 财务数据锁定表
# 计划中的输出: 改写稿 + 陈述定级核对表 + 数字回归报告
# 规范载体: 参照 platform_mechanisms 结构派生 bp_norms(forbidden_claim_patterns:
#   "行业第一/重新定义/保证回报"等无据宣称)

targets:
  prompt: {file: null, since: v0.1}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_rewrite, since: v0.2}

