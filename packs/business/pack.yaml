pack: business
name: 商业计划书与融资材料
kind: writing_module
version: 0.2.0
language: zh-CN
owner: valentino
description: 处理 BP、路演稿与口播，强制区分事实、内部数据、外部估计、假设、预测和愿景，陈述级别不得升级。
inputs:
  - {slot: 投资阶段, type: text, required: true, source: user, description: 种子、天使、A轮等}
  - slot: 材料类型
    type: enum
    required: true
    source: user
    enum: [bp_section, pitch_script, spoken_pitch, memo]
    description: 交付形态
  - {slot: 陈述定级清单, type: markdown, required: true, source: ledger, description: 事实与预测的级别}
  - {slot: 原文/信息点, type: text, required: true, source: user, description: 唯一内容来源}
outputs:
  - {name: final, format: markdown, description: 改写稿}
  - {name: statement_grading, format: table, description: 陈述级别回归}
  - {name: numeric_audit, format: json, description: 数字审计}
  - {name: diff, format: markdown, description: 差异}
targets:
  prompt: {file: prompt.business_rewrite.zh.md, since: v0.1}
  skill: {file: null, since: v0.1}
  mcp: {tool: style_rewrite, since: v0.2}
compiled_from:
  blocks: [task_contract, content_ledger, style_card, domain_pack, exemplars, operation_rules, output_contract]
  style_cards: []
  domain_pack: packs/business
  negative_cards: [packs/global/deai.negative.zh.yaml]
delivery: {prompt: ready, skill: buildable, cli: ready, mcp: ready, api: ready}
validation:
  example: passed
  automated_smoke: passed
  formal_blind_test: pending
  real_pilot: pending
  notes: [事实、预测和愿景必须分级；自动化 fixture 不能替代投资人盲测。]
maturity: engine_compiled
eval:
  evaluator_profile: business
  baseline: one_shot_bp_polish
  smoke_set: evaluations/smoke/business
  formal_set: null
  gates: {statement_grade_intact: true, numeric_drift: 0, forecast_to_fact_upgrades: 0, new_hard_facts: 0}
changelog:
  - {version: 0.2.0, date: 2026-08-28, change: 从占位卡升级为可运行 Pack，加入陈述定级与数字回归}
